# Local stack: PostgreSQL, a one-shot migration job, the API and the outbox relay.
#   docker compose up --build      then open http://localhost:8000/docs

x-app: &app
  build: .
  environment:
    LEDGER_ENVIRONMENT: development
    LEDGER_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ledger
    LEDGER_JWT_SECRET: ${LEDGER_JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
    LEDGER_TRANSFER_FEE_BPS: ${LEDGER_TRANSFER_FEE_BPS:-0}
    LEDGER_LOG_JSON: "true"
    LEDGER_WEBHOOK_URL: ${LEDGER_WEBHOOK_URL:-}
    LEDGER_WEBHOOK_SECRET: ${LEDGER_WEBHOOK_SECRET:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  relay:
    <<: *app
    command: ["ledgerline", "relay"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
